<body class="font-body-md text-body-md flex flex-col min-h-screen" style="background-color: rgb(250, 248, 243);">
<!-- TopNavBar -->
<nav class="bg-background dark:bg-background border-b border-outline-variant dark:border-outline fixed top-0 w-full z-50">
<div class="flex justify-between items-center px-margin-desktop py-6 max-w-container-max mx-auto">
<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim tracking-tight">
                MCG UTM</div>
<div class="hidden md:flex items-center gap-8">
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300 font-body-md" href="#">Services</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300 font-body-md" href="#">About</a>
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300 font-body-md" href="#">Support</a>
<div class="flex items-center gap-4 ml-4">
<a class="text-secondary dark:text-secondary-fixed-dim hover:text-primary dark:hover:text-primary-fixed transition-colors duration-300 font-body-md" href="#">Login</a>
<a class="text-primary dark:text-primary-fixed-dim font-bold border-b-2 border-primary pb-1 font-body-md" href="#">Register</a>
</div>
</div>
<button class="md:hidden text-primary">
<span class="material-symbols-outlined">menu</span>
</button>
</div>
</nav>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center pt-32 pb-24 px-margin-mobile md:px-margin-desktop bg-[#FAF8F3]">
<div class="w-full max-w-md bg-white rounded-lg luxury-shadow auth-card p-10 md:p-12">
<!-- Header -->
<div class="text-center mb-10">
<h1 class="font-headline-md text-headline-md text-on-background mb-3">Create Account</h1>
<p class="font-body-lg text-body-lg text-secondary">Join our community.</p>
</div>
<!-- Form -->
<form action="#" class="space-y-6">
<!-- Full Name -->
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant" for="name">Full Name</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 focus:ring-1 focus:ring-primary placeholder:text-outline outline-none transition-all duration-200" id="name" name="name" placeholder="Evelyn Thorne" type="text">
</div>
<!-- Email -->
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant" for="email">Email</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 focus:ring-1 focus:ring-primary placeholder:text-outline outline-none transition-all duration-200" id="email" name="email" placeholder="evelyn@example.com" type="email">
</div>
<!-- Password -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 focus:ring-1 focus:ring-primary placeholder:text-outline outline-none transition-all duration-200" id="password" name="password" placeholder="••••••••" type="password">
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant" for="confirm-password">Confirm</label>
<input class="w-full bg-surface-container-low border-none rounded-lg p-4 focus:ring-1 focus:ring-primary placeholder:text-outline outline-none transition-all duration-200" id="confirm-password" name="confirm-password" placeholder="••••••••" type="password">
</div>
</div>
<!-- CTA -->
<button class="w-full bg-primary text-on-primary font-body-lg py-4 rounded-full luxury-shadow hover:opacity-90 active:scale-[0.98] transition-all duration-300 mt-4" type="submit">
                    Register
                </button>
</form>
<!-- Quiet Alert -->
<div class="mt-8 flex items-center justify-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="text-label-md text-secondary">Secure, encrypted connection enabled.</span>
</div>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="font-body-md text-secondary">
                    Already have an account?
                    <a class="text-primary font-bold hover:underline underline-offset-4 transition-all" href="#">Login</a>
</p>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-surface-container-low dark:bg-surface-container-lowest border-t border-outline-variant dark:border-outline">

<div class="mb-6 md:mb-0">

<p class="text-secondary dark:text-secondary-fixed-dim mt-2 font-body-md"><span class="text-label-md block max-w-prose text-center md:text-left">Built for the Mandarin Care Group, UTM. A digital sanctuary for holistic growth.</span></p>
</div>
<div class="flex flex-col md:flex-row items-center gap-6 md:gap-10">
<div class="flex gap-6">



</div>

</div>
</div>
</footer>
<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
    </script>
